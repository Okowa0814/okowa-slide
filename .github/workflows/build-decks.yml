name: Build decks.json

on:
    push:
        branches: [main]
        paths-ignore:
            - decks.json
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: python .github/scripts/build_decks.py
            - name: Commit decks.json
              run: |
                  if git diff --quiet -- decks.json && git ls-files --error-unmatch decks.json >/dev/null 2>&1; then
                      echo "decks.json unchanged"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add decks.json
                  git commit -m "chore(lobby): update decks.json" -m "Regenerated by the build-decks workflow."
                  git push
